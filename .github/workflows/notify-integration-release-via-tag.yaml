name: Notify Integration Release (Tag)

on:
  push:
    # disabled until provider recognised upstream
    # Restore `tags: ["v*"]` when the integration notification is needed.
    branches-ignore:
      - "**"
    tags-ignore:
      - "**"

permissions: {}

jobs:
  strip-version:
    name: Strip Version
    runs-on: ubuntu-latest
    outputs:
      packer-version: ${{ steps.strip.outputs.packer-version }}
    steps:
      - name: Strip leading v from version tag
        id: strip
        env:
          REF: ${{ github.ref_name }}
        run: echo "packer-version=$(echo "$REF" | sed -E 's/^v//')" >> "$GITHUB_OUTPUT"

  notify-release:
    name: Notify Release
    needs:
      - strip-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify generated docs
        run: |
          make generate
          git diff --exit-code

      - name: Checkout integration-release-action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hashicorp/integration-release-action
          ref: 5c982331bf102b6d9ffae6f820eb9ffda93cd7ea
          path: ./integration-release-action
          persist-credentials: false

      - name: Notify Release
        uses: ./integration-release-action
        with:
          integration_identifier: "packer/thevilledev/verda"
          release_version: ${{ needs.strip-version.outputs.packer-version }}
          release_sha: ${{ github.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
