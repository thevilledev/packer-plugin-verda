<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <style>
      body {
        color: #1f2933;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
        margin: 0;
      }

      main {
        margin: 0 auto;
        max-width: 960px;
        padding: 2rem 1.25rem 4rem;
      }

      a {
        color: #0f766e;
      }

      code {
        background: #f3f4f6;
        border-radius: 4px;
        padding: 0.1rem 0.25rem;
      }

      pre {
        background: #111827;
        border-radius: 6px;
        color: #f9fafb;
        overflow-x: auto;
        padding: 1rem;
      }

      pre code {
        background: transparent;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
